# CI for the Purelane sections.
#
# Dawn ships a workflow that runs Lighthouse against a Shopify-internal store using
# secrets we do not have, so it can never pass here. Replaced with checks that are ours
# and that actually run:
#
#   1. Shopify Theme Check  — the standard linter for Liquid themes
#   2. Section validation   — every section's schema JSON parses and Liquid tags balance
#
# Point 2 exists because a malformed schema does not break the storefront; it silently
# stops the section appearing in the theme editor, which is the kind of failure a client
# reports and you cannot reproduce locally.

name: CI
on:
  push:
    branches: [main]
  pull_request:

# theme-check-action publishes its results as a GitHub check run, which the default
# read-only token cannot create.
permissions:
  contents: read
  checks: write

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Theme Check
        uses: Shopify/theme-check-action@v2
        with:
          token: ${{ github.token }}

  sections:
    name: Section schema and Liquid tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Purelane sections
        run: python3 scripts/validate_sections.py
